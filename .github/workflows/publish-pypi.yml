name: Publish to PyPI

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: labpilot-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[desktop,ai,dev,fit]"
      - run: python -m pytest -q

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check tag and install the wheel with core dependencies only
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import tomllib
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["GITHUB_REF"] != f"refs/tags/v{version}":
              raise SystemExit(f"Publish from tag v{version}")
          PY
          python -m venv smoke
          smoke/bin/python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/smoke/bin/labpilot" init
          "$GITHUB_WORKSPACE/smoke/bin/labpilot" doctor
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY"
          else
            options=()
            if [[ "$tag" =~ (a|b|rc)[0-9]+$ ]]; then
              options+=(--prerelease)
            fi
            notes="docs/releases/$tag.md"
            if [[ -f "$notes" ]]; then
              options+=(--notes-file "$notes")
            else
              options+=(--generate-notes)
            fi
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "LabPilot AI $tag" "${options[@]}"
          fi

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/labpilot-ai
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
